<!doctype html>
<html lang="fr" class="home-page">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Application d'Appel WebRTC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/meeting.css?v=5" />
</head>

<body class="home-page">
  <!--
      Écran d'accueil uniquement.
      Les interfaces d'appel (audio / entrant / vidéo) sont injectées par CallManager.js
      — ne pas les dupliquer ici, sinon CallManager refuse d'injecter son HTML complet
      (bascule caméra, haut-parleur, badges, etc.).
    -->
  <main class="container home-shell">
    <audio id="remoteAudio" autoplay playsinline></audio>
    <header class="home-header"><div><p class="eyebrow">Communication s&eacute;curis&eacute;e</p><h1>Terminal</h1></div><div id="status" class="status-pill" role="status"><span class="status-indicator"></span><span class="status-label">Hors ligne</span></div></header>
    <section class="card id-card" aria-label="Identifiant du terminal"><div><span class="label">Votre identifiant</span><div id="my-id-display" class="id-box">G&eacute;n&eacute;ration...</div></div><button id="btn-copy" class="btn btn-secondary" type="button" onclick="copyMyId()" aria-label="Copier mon identifiant"><i class="fa-regular fa-copy"></i> Copier l'ID</button></section>
    <section class="card call-card"><div><p class="eyebrow">Communication directe</p><h2>Appeler</h2></div><label class="sr-only" for="target-id-input">Identifiant &agrave; appeler</label><input type="text" id="target-id-input" placeholder="Saisir un identifiant" autocomplete="off"/><div class="actions"><button id="btn-call" class="btn btn-primary" type="button" onclick="makeCall()"><i class="fa-solid fa-phone"></i> Audio</button><button id="btn-video-call" class="btn btn-secondary" type="button" onclick="makeVideoCall()"><i class="fa-solid fa-video"></i> Vid&eacute;o</button></div></section>
    <section class="meeting-home-section"><div><p class="eyebrow">&Eacute;changez &agrave; plusieurs</p><h2>R&eacute;unions</h2></div><div class="meeting-home-grid"><button id="btn-meeting-instant" class="meeting-home-action" type="button" onclick="startInstantMeeting()"><i class="fa-solid fa-video"></i><span>Nouvelle r&eacute;union</span><small>D&eacute;marrer tout de suite</small></button><button id="btn-meeting-join" class="meeting-home-action" type="button" onclick="showMeetingJoinView()"><i class="fa-solid fa-keyboard"></i><span>Rejoindre avec un code</span><small>Entrer dans une r&eacute;union</small></button><button id="btn-meeting-create" class="meeting-home-action" type="button" onclick="showMeetingCreateView()"><i class="fa-solid fa-calendar-plus"></i><span>Planifier</span><small>Cr&eacute;er un rendez-vous</small></button></div></section>
  </main>

  <script src="cordova.js"></script>
  <script src="js/effet.js"></script>
  <script src="js/vendor/livekit-client.umd.js"></script>
  <script src="js/LiveKitManager.js"></script>
  <!-- CallManager remplace l'ancien index.js : HTML+CSS+WebRTC+UI complets -->
  <script src="js/CallManager.js"></script>
  <!-- Extensions pour les réunions planifiées -->
  <script src="js/Meetings.js"></script>
</body>

</html>
